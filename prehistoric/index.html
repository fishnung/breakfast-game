<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>史前生存大冒險</title><style>body{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;margin:0;background:#f5efe2;color:#2f352f}.w{max-width:900px;margin:auto;padding:16px}.card{background:#fffdf8;border:1px solid #d8d0bf;border-radius:20px;padding:20px;margin:14px 0}.hero{font-size:clamp(28px,5vw,44px);font-weight:900}.muted{color:#6c746d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{padding:16px;border:2px solid #d8d0bf;border-radius:16px;background:white;text-align:left}.opt.sel{border-color:#4d7d6d;background:#eef6f2}.opt h3{margin:0 0 6px}.opt p{margin:0 0 8px;color:#68716a;line-height:1.5}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:#4d7d6d;color:white}.btn[disabled]{opacity:.45}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:999px;background:#eee7da;font-weight:700;font-size:14px}.story{background:#fbf4e4;border-left:5px solid #a5764d;padding:14px;border-radius:10px;line-height:1.7}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.score{background:white;border:1px solid #d8d0bf;border-radius:15px;padding:14px;text-align:center}.score b{display:block;font-size:30px}.hidden{display:none}.choices{margin-top:12px}.choice{display:block;width:100%;text-align:left;margin:7px 0;padding:11px;border:1px solid #d8d0bf;border-radius:10px;background:white}.choice.sel{background:#f2edf8;border-color:#8067a4}.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.era{background:#fff;border:1px solid #d8d0bf;border-radius:14px;padding:12px}.small{font-size:13px;color:#6c746d}@media(max-width:650px){.grid,.scores,.timeline{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="hero">🏕️ 史前生存大冒險</div><p class="muted">島嶼部落的萬年生存記｜國小五年級體驗版</p><section id="start" class="card"><h2>你們就是史前人。</h2><p>每關有 4 點人力，每個行動花 2 點，所以四個行動只能選兩個。以前學會的東西，有些會影響後面的發展。</p><input id="name" placeholder="輸入部落名稱" style="width:100%;padding:12px;border:1px solid #d8d0bf;border-radius:10px;font-size:16px;box-sizing:border-box"><p><button id="begin" class="btn">開始冒險</button></p></section><section id="play" class="hidden"></section><section id="final" class="hidden"></section><p class="small">提醒：遊戲把不同時間、不同地點的史前文化壓縮成三個體驗階段，不代表同一個部落真的延續數千年。</p></div><script>(()=>{const S={tribe:'',score:{life:0,tech:0,social:0},badges:[],round:0,culture:null};const rounds=[{icon:'🌊',title:'海邊洞穴的生存挑戰',story:'你們住在臺灣東部靠海的洞穴附近。沒有農田、商店、冰箱。海邊有魚蝦貝類，森林有植物和動物。天氣變冷了，你們要把人力用在哪兩件事？',o:[['stone','🪨 敲製石器','做出有鋒利邊緣的石器。','🛠️+2 🍖+1',{tech:2,life:1},'打製石器'],['fire','🔥 維持火源','找柴、生火、輪流顧火。','🍖+2 🛠️+1',{life:2,tech:1},'用火'],['shore','🐟 海邊找食物','捕魚、撿貝類、採集食物。','🍖+3',{life:3},null],['hunt','🐗 森林狩獵採集','合作追蹤動物、採集植物。','🍖+2 👥+1',{life:2,social:1},null]]},{icon:'🌾',title:'平原上的新生活',story:'又過了很久。你們發現有些植物可以種在住家附近，也開始照顧動物。人們住得更固定，新的問題也來了：怎麼讓食物更穩定？怎麼保存？怎麼讓更多人一起生活？',o:[['farm','🌾 農耕與飼養','種植作物，也開始飼養動物。','🍖+3；有打製石器再🛠️+1',{life:3},'農耕生活'],['polish','🪨 磨製石器','把石器磨得更適合生活與農耕。','🛠️+2 🍖+1',{tech:2,life:1},'磨製石器'],['pot','🏺 製作陶器','挖黏土、塑形，再用高溫燒硬。','🛠️+2 🍖+1；有用火再🛠️+1',{tech:2,life:1},'陶器'],['settle','🏘️ 建立固定聚落','合作蓋房屋、整理生活空間。','👥+2 🍖+1；有農耕再👥+1',{social:2,life:1},'聚落']]},{icon:'⚒️',title:'大聚落的新技術',story:'聚落已經更大。石頭工具雖然能用，但大量農事很花力氣。有人學會利用高溫處理金屬材料。你們要投入哪兩件事？',o:[['iron','🔥 研究高溫煉鐵','研究爐火與材料，學習製作鐵器。','🛠️+3',{tech:3},'煉鐵技術'],['tools','⛏️ 製作鐵製工具','做更耐用的工具幫助農耕。','🛠️+2 🍖+1；有煉鐵再🍖+2',{tech:2,life:1},'鐵農具'],['morefarm','🌾 擴大農業生產','投入更多人力耕作。','🍖+3；有鐵農具再🍖+1',{life:3},null],['moretown','🏘️ 擴大聚落','整理房屋、物資與合作。','👥+2 🍖+1',{social:2,life:1},null]]}];function add(x){Object.entries(x||{}).forEach(([k,v])=>S.score[k]+=v)}function bonus(id){if(id==='farm'&&S.badges.includes('打製石器'))return{tech:1};if(id==='pot'&&S.badges.includes('用火'))return{tech:1};if(id==='settle'&&S.badges.includes('農耕生活'))return{social:1};if(id==='tools'&&S.badges.includes('煉鐵技術'))return{life:2};if(id==='morefarm'&&S.badges.includes('鐵農具'))return{life:1};return null}function renderRound(i){S.round=i;const r=rounds[i];let chosen=[];play.innerHTML=`<div class="card"><h2>${r.icon} ${r.title}</h2><div class="story">${r.story}</div><p><span class="chip">⚡4點人力</span> <span class="chip">四選二</span></p><div class="grid">${r.o.map((x,j)=>`<button class="opt" data-id="${x[0]}"><h3>${String.fromCharCode(65+j)}. ${x[1]}</h3><p>${x[2]}</p><b>${x[3]}</b></button>`).join('')}</div><p style="text-align:center">已選 <b id="cnt">0</b>/2</p><p style="text-align:center"><button id="ok" class="btn" disabled>確認這一關</button></p></div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(chosen.includes(id)){chosen=chosen.filter(x=>x!==id);b.classList.remove('sel')}else if(chosen.length<2){chosen.push(id);b.classList.add('sel')}cnt.textContent=chosen.length;ok.disabled=chosen.length!==2});ok.onclick=()=>{chosen.forEach(id=>{const x=r.o.find(a=>a[0]===id);add(x[4]);add(bonus(id));if(x[5]&&!S.badges.includes(x[5]))S.badges.push(x[5])});if(i===1)return culture();if(i<2)return bridge(i+1);mystery()}}function bridge(n){play.innerHTML=`<div class="card"><h2>⏳ 時間繼續往前走……</h2><p>以前學會的東西會跟著你們。</p><div class="chips">${S.badges.map(x=>`<span class="chip">✓ ${x}</span>`).join('')||'<span class="chip">目前沒有技術物品</span>'}</div><p><button id="next" class="btn">進入下一階段</button></p></div>`;next.onclick=()=>renderRound(n)}function culture(){play.innerHTML=`<div class="card"><h2>🌙 聚落文化事件：我們不只想活著</h2><div class="story">有人花很多時間磨製漂亮玉器，人們也為過世的族人安排墓葬。這些事情不能直接增加食物。你們覺得，為什麼史前人還願意做？</div><div class="grid"><div class="era"><h3>💎 精美玉器</h3><p>可能和美感、身分、交換、重要關係或特殊意義有關。</p></div><div class="era"><h3>🪦 墓葬與石板棺</h3><p>可能和紀念死者、家族關係、儀式或信仰有關。</p></div></div><div class="choices">${['覺得漂亮，想裝飾自己','表示身分或重要性','和祖先、死亡、儀式或信仰有關','和送禮、交換或人際關係有關','以上都有可能，要看更多證據'].map((x,i)=>`<button class="choice" data-i="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><p><button id="go" class="btn" disabled>記下推測，繼續</button></p></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');S.culture=+b.dataset.i;go.disabled=false});go.onclick=()=>renderRound(2)}function mystery(){play.innerHTML=`<div class="card"><h2>🧭 神秘物品事件</h2><div class="grid"><div class="era"><h3>💚 臺灣玉為什麼到處都有？</h3><p>花蓮出產的臺灣玉，在臺灣多處史前遺址出現。線索：不同聚落之間的交換。</p></div><div class="era"><h3>🔵 十三行為什麼有東南亞琉璃珠？</h3><p>臺灣北部遺址發現東南亞琉璃珠，臺灣玉也曾出現在東南亞。線索：航海與跨海交流。</p></div></div><p><button id="finish" class="btn">查看最終結果</button></p></div>`;finish.onclick=showFinal}function showFinal(){play.classList.add('hidden');final.classList.remove('hidden');const s=S.score,m=Math.max(s.life,s.tech,s.social);let title=m===s.life&&m===s.tech||m===s.life&&m===s.social||m===s.tech&&m===s.social?'⚖️ 全能型部落':m===s.life?'🌾 豐饒大聚落':m===s.tech?'⚒️ 技術開拓者':'🌊 社會文化交流者';final.innerHTML=`<div class="card"><h2>🏁 ${S.tribe} 的萬年生存記</h2><div class="scores"><div class="score">🍖 生存與生產<b>${s.life}</b></div><div class="score">🛠️ 技術<b>${s.tech}</b></div><div class="score">👥 社會與文化<b>${s.social}</b></div></div><h2>${title}</h2><div class="chips">${S.badges.map(x=>`<span class="chip">${x}</span>`).join('')}</div><h3>給老師看的結果代碼</h3><div class="story">${S.tribe}｜生活${s.life}-技術${s.tech}-社會${s.social}｜${S.badges.join('、')}</div><div class="timeline"><div class="era"><b>🌊 第一階段</b><p>就地取材、打製石器、用火、採集狩獵</p></div><div class="era"><b>🌾 第二階段</b><p>農耕、磨製石器、陶器、聚落與文化</p></div><div class="era"><b>⚒️ 第三階段</b><p>煉鐵、鐵器、生產效率與聚落</p></div></div><p><button id="decode" class="btn">老師說可以後，再按課本大解密</button></p><div id="lesson" class="hidden"><h2>📚 課本大解密</h2><h3>舊石器時代・長濱文化</h3><p>海濱洞穴、捕魚採集狩獵、用火、打製石器。</p><h3>新石器時代</h3><p>農耕與飼養、磨製石器、陶器、人口成長與聚落；玉器與墓葬也讓我們推測美感、身分、關係、儀式與信仰。</p><h3>金屬器時代・十三行文化</h3><p>煉鐵、鐵器、提高農業效率；外來琉璃珠等證據顯示更廣的交流。</p><h3>交換與航海</h3><p>臺灣玉在島內多處出現，顯示聚落間交換；十三行有東南亞琉璃珠，臺灣玉也出現在東南亞，顯示跨海交流。</p><div class="story"><b>一起討論：</b>一開始三個部落都一樣，為什麼最後不同？哪一次選擇影響了後面？</div><p><b>考古提醒：</b>文物是證據，歷史是根據證據做出的推論。</p></div></div>`;decode.onclick=()=>lesson.classList.remove('hidden')}begin.onclick=()=>{const n=name.value.trim();if(!n)return name.focus();S.tribe=n;start.classList.add('hidden');play.classList.remove('hidden');renderRound(0)}})();</script></body></html>
